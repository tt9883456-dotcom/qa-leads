name: Test Lead Collector

on:
  workflow_dispatch: # Кнопка для ручного запуска
  schedule:
    - cron: '*/5 * * * *' # Запуск каждые 5 минут

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run script
        run: python main.py
