name: Test Lead Collector

on:
  workflow_dispatch: # Кнопка для ручного запуска
  schedule:
    - cron: '*/5 * * * *' # Запуск каждые 5 минут

permissions:
  contents: write # РАЗРЕШАЕМ скрипту сохранять файлы в репозиторий

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run script
        run: python main.py
        
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add leads.csv
          git commit -m "Update leads" || echo "No changes to commit"
          git push
